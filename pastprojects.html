<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Project Viewer with Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      background: #61503c;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    /* Left Navigation Styles */
    nav {
      width: 33.33%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      background: transparent;
      z-index: 2;
    }

    .nav-buttons {
      list-style: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 0;
      margin: 0;
    }

    .nav-buttons li {
      height: 20vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-buttons li a {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px) brightness(1.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .nav-buttons li a:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Thumbnail Gallery Styles - Updated for vertical right alignment */
    #thumbnails {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
      gap: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }
    
    #thumbnails::-webkit-scrollbar {
      width: 6px;
    }
    
    #thumbnails::-webkit-scrollbar-track {
      background: transparent;
    }
    
    #thumbnails::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.3);
      border-radius: 3px;
    }
    
    .thumbnail {
      width: 80px;
      height: 80px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    
    .thumbnail:hover {
      border-color: #0066cc;
      transform: scale(1.1);
    }
    
    #gallery-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    
    .nav-btn {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      text-align: center;
    }
    
    .nav-btn:hover {
      background: rgba(255,255,255,0.4);
    }
    
    /* Three.js Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 33.33%;
      width: 66.66%;
      height: 100%;
    }
    
    /* Drop Zone */
    .drop-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 1000;
      pointer-events: none;
      border: 4px dashed white;
    }
    
    .drop-zone div {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2em;
      text-align: center;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      
      nav {
        width: 100%;
        height: auto;
      }
      
      .nav-buttons {
        flex-direction: row;
        flex-wrap: wrap;
        height: auto;
        padding: 10px;
      }
      
      .nav-buttons li {
        height: 60px;
        padding: 5px;
        flex: 1 0 45%;
      }
      
#canvas-container {
  position: fixed; /* or absolute if inside another wrapper */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* ensures no scrollbars from Three.js */
  z-index: 0; 
      }
      
      #thumbnails {
        top: auto;
        bottom: 10px;
        right: 10px;
        transform: none;
        flex-direction: row;
        max-height: 100px;
        max-width: 90%;
        overflow-x: auto;
        overflow-y: hidden;
      }
      
      #gallery-controls {
        flex-direction: row;
      }
      
      .thumbnail {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <!-- Left Navigation Panel -->
  <nav>
    <ul class="nav-buttons">
      <li><a href="#" id="nav-intro">Intro View</a></li>
      <li><a href="#" id="nav-overview">Overview</a></li>
      <li><a href="#" id="nav-detail">Detail View</a></li>
      <li><a href="#" id="nav-orbit">Orbit Mode</a></li>
    </ul>
  </nav>

  <!-- Three.js will render here -->
  <div id="canvas-container"></div>
  
  <!-- Thumbnail Gallery - Updated structure for vertical layout -->
  <div id="thumbnails">
    <div id="gallery-controls">
      <button id="prev-btn" class="nav-btn">▲ Previous</button>
      <img src="assets/images/Background2.png" class="thumbnail" draggable="true">
      <img src="assets/images/Slide1.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide2.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide3.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide4.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide5.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide6.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide7.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide8.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide9.PNG" class="thumbnail" draggable="true">
      <img src="assets/images/Slide10.PNG" class="thumbnail" draggable="true">
      <button id="next-btn" class="nav-btn">▼ Next</button>
    </div>
  </div>

  <!-- Drop Zone -->
  <div class="drop-zone">
    <div>Drop PNG Image Here<br><span style="font-size: 0.6em;">(PNG or JPG files only)</span></div>
  </div>

  <!-- CDN Imports -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/lights/RectAreaLightUniformsLib.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/helpers/RectAreaLightHelper.js"></script>

  <!-- Main Application Script -->
  <script>
    // Initialize area light support
    THREE.RectAreaLightUniformsLib.init();

    // ======================
    // ASSET PATHS
    // ======================
    const ASSETS = {
      MODEL: 'assets/models/DeskOverview1.glb',
      BACKGROUND: 'assets/images/BackgroundRotating.png',
      DEFAULT_SCREEN_TEXTURE: 'assets/images/default-screen.png'
    };

    // ======================
    // SCREEN ANCHOR POINTS
    // ======================
    const SCREEN_Y_OFFSET = -0.995;
    const SCREEN_ANCHORS = [
      new THREE.Vector3(0.5218123197555542, 0.8660084009170532 + SCREEN_Y_OFFSET, -0.6475707292556763),  // top-right
      new THREE.Vector3(0.5218123197555542, 0.733871579170227 + SCREEN_Y_OFFSET, -0.0846579372882843),   // bottom-right
      new THREE.Vector3(-0.27778705954551697, 0.8660078048706055 + SCREEN_Y_OFFSET, -0.6475707292556763), // top-left
      new THREE.Vector3(-0.2777869999408722, 0.7338709831237793 + SCREEN_Y_OFFSET, -0.0846579372882843)  // bottom-left
    ];

    // Calculate screen center point
    const screenCenter = new THREE.Vector3();
    SCREEN_ANCHORS.forEach(point => screenCenter.add(point));
    screenCenter.divideScalar(SCREEN_ANCHORS.length);

    // ======================
    // GLOBAL VARIABLES
    // ======================
    let screenMesh = null;
    let screenMaterial = null;
    const allowedImageTypes = ['image/png', 'image/jpeg', 'image/jpg'];
    let debugHelpers = [];
    let screenFillLight;
    let currentImageTexture = null;
    let screenPlane = null;
    let screenQuad = null;

    // ======================
    // CAMERA PRESETS
    // ======================
    const CAMERA_PRESETS = {
      INTRO: {
        position: new THREE.Vector3(0, 2.05, 3.9),
        target: new THREE.Vector3(0, -0.2, 0),
        fov: 35
      },
      OVERVIEW: {
        position: new THREE.Vector3(0, 0.43, -0.195),
        target: new THREE.Vector3(0, -2.5, -1.0),
        fov: 50
      },
      DETAIL_VIEW: {
        position: new THREE.Vector3(0, 0.2, 4.5),
        target: new THREE.Vector3(0, -1.2, -13),
        fov: 35
      },
      ORBIT: {
        radius: 5,
        height: -0.3,
        speed: 0.002
      }
    };

    // ======================
    // CAMERA RIG SYSTEM
    // ======================
    class CameraRig {
      constructor(camera, controls) {
        this.camera = camera;
        this.controls = controls;
        this.isOrbiting = false;
        this.orbitAngle = 0;
      }

      transitionTo(presetName, duration = 2) {
        const preset = CAMERA_PRESETS[presetName];
        if (!preset) {
          console.warn(`Camera preset "${presetName}" not found.`);
          return;
        }

        this.isOrbiting = false;
        this.controls.autoRotate = false;

        gsap.timeline()
          .to(this.camera.position, {
            x: preset.position.x,
            y: preset.position.y,
            z: preset.position.z,
            duration,
            ease: 'sine.inOut'
          })
          .to(this.controls.target, {
            x: preset.target.x,
            y: preset.target.y,
            z: preset.target.z,
            duration: duration * 0.9
          }, '<0.2')
          .to(this.camera, {
            fov: preset.fov || 50,
            duration: duration * 0.7,
            onUpdate: () => this.camera.updateProjectionMatrix()
          }, '<');
      }

      startOrbiting() {
        this.isOrbiting = true;
        this.orbitAngle = 0;
        const preset = CAMERA_PRESETS.ORBIT;
        this.controls.autoRotate = true;
        this.controls.autoRotateSpeed = preset.speed;
        this.controls.target.set(0, preset.height, 0);
      }

      update() {
        if (this.isOrbiting) {
          const preset = CAMERA_PRESETS.ORBIT;
          this.orbitAngle += preset.speed;
          this.camera.position.x = Math.sin(this.orbitAngle) * preset.radius;
          this.camera.position.z = Math.cos(this.orbitAngle) * preset.radius;
          this.camera.position.y = preset.height;
          this.controls.update();
        }
      }
    }

    // ======================
    // SCENE SETUP
    // ======================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.domElement.id = 'threejs-canvas';
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.physicallyCorrectLights = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;

    // ======================
    // SCREEN QUAD SETUP
    // ======================
    function createScreenQuad() {
      const geometry = new THREE.BufferGeometry();
      
      const vertices = new Float32Array([
        SCREEN_ANCHORS[2].x, SCREEN_ANCHORS[2].y, SCREEN_ANCHORS[2].z,
        SCREEN_ANCHORS[0].x, SCREEN_ANCHORS[0].y, SCREEN_ANCHORS[0].z,
        SCREEN_ANCHORS[3].x, SCREEN_ANCHORS[3].y, SCREEN_ANCHORS[3].z,
        SCREEN_ANCHORS[1].x, SCREEN_ANCHORS[1].y, SCREEN_ANCHORS[1].z
      ]);
      
      const uvs = new Float32Array([
        0, 1,
        1, 1,
        0, 0,
        1, 0
      ]);
      
      const indices = new Uint16Array([0, 1, 2, 1, 3, 2]);
      
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.setIndex(new THREE.BufferAttribute(indices, 1));
      
      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 1.0,
        toneMapped: false,
        premultipliedAlpha: false
      });
      
      screenQuad = new THREE.Mesh(geometry, material);
      screenQuad.renderOrder = 999;
      scene.add(screenQuad);
    }

    // ======================
    // LIGHTING
    // ======================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(5, 10, 7);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    screenFillLight = new THREE.RectAreaLight(0xffffff, 0, 3, 3);
    screenFillLight.position.set(0, 5, 0.2);
    screenFillLight.rotation.x = -Math.PI / 2;
    scene.add(screenFillLight);

    const lightHelper = new THREE.RectAreaLightHelper(screenFillLight);
    scene.add(lightHelper);

    // ======================
    // BACKGROUND
    // ======================
    const bgTexture = new THREE.TextureLoader().load(ASSETS.BACKGROUND);
    bgTexture.encoding = THREE.sRGBEncoding;
    scene.background = bgTexture;

    // ======================
    // MODEL LOADING & SCREEN SETUP
    // ======================
    const loader = new THREE.GLTFLoader();
    let deskModel;

    loader.load(ASSETS.MODEL, (gltf) => {
      deskModel = gltf.scene;
      console.log('Model loaded:', gltf);

      gltf.scene.traverse((child) => {
        if (child.isLight) {
          child.intensity *= 1.5;
          child.castShadow = true;
          console.log(`Light found: ${child.name}`, child);
        }
      });

      gltf.scene.traverse((child) => {
        if (child.isMesh && child.name === 'PNGApplicationScreen') {
          screenMesh = child;
          
          screenMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.01,
            side: THREE.DoubleSide,
            toneMapped: false
          });
          
          screenMesh.material = screenMaterial;
          screenMesh.renderOrder = 998;
        }

        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          
          if (child.material.emissiveMap) {
            child.material.emissiveIntensity = 1.0;
            child.material.emissiveMap.encoding = THREE.sRGBEncoding;
          }
        }
      });

      deskModel.position.set(0, -1, 0);
      scene.add(deskModel);
      createScreenQuad();
      
      // Load default screen texture
      if (ASSETS.DEFAULT_SCREEN_TEXTURE) {
        currentImageTexture = new THREE.TextureLoader().load(ASSETS.DEFAULT_SCREEN_TEXTURE, (tex) => {
          tex.encoding = THREE.sRGBEncoding;
          tex.flipY = false;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          screenQuad.material.map = tex;
          screenQuad.material.toneMapped = false;
          screenQuad.material.needsUpdate = true;
        });
      }
    }, undefined, (error) => {
      console.error('Error loading model:', error);
    });

    // ======================
    // THUMBNAIL GALLERY INTERACTION - UPDATED FOR VERTICAL LAYOUT
    // ======================
    const thumbnails = document.querySelectorAll('.thumbnail');
    const dropZone = document.querySelector('.drop-zone');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    let currentThumbnailIndex = 0;

    // Handle thumbnail clicks
    thumbnails.forEach((thumb, index) => {
      thumb.addEventListener('click', () => {
        currentThumbnailIndex = index;
        loadImageToScreen(thumb.src);
        updateActiveThumbnail();
      });
    });

    // Navigation buttons - updated for vertical layout
    prevBtn.addEventListener('click', () => {
      if (currentThumbnailIndex > 0) {
        currentThumbnailIndex--;
      } else {
        currentThumbnailIndex = thumbnails.length - 1;
      }
      loadImageToScreen(thumbnails[currentThumbnailIndex].src);
      updateActiveThumbnail();
    });

    nextBtn.addEventListener('click', () => {
      if (currentThumbnailIndex < thumbnails.length - 1) {
        currentThumbnailIndex++;
      } else {
        currentThumbnailIndex = 0;
      }
      loadImageToScreen(thumbnails[currentThumbnailIndex].src);
      updateActiveThumbnail();
    });

    function updateActiveThumbnail() {
      thumbnails.forEach((thumb, index) => {
        if (index === currentThumbnailIndex) {
          thumb.style.borderColor = '#0066cc';
          thumb.style.transform = 'scale(1.1)';
          // Scroll into view
          thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          thumb.style.borderColor = 'transparent';
          thumb.style.transform = 'scale(1)';
        }
      });
    }

    function loadImageToScreen(imageUrl) {
      if (!screenQuad) {
        console.warn('Screen quad not ready yet');
        return;
      }

      const loader = new THREE.TextureLoader();
      loader.load(imageUrl, (texture) => {
        if (currentImageTexture) currentImageTexture.dispose();
        
        currentImageTexture = texture;
        currentImageTexture.encoding = THREE.sRGBEncoding;
        currentImageTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        currentImageTexture.minFilter = THREE.LinearFilter;
        currentImageTexture.magFilter = THREE.LinearFilter;
        
        screenQuad.material.map = currentImageTexture;
        screenQuad.material.needsUpdate = true;
        
        cameraRig.transitionTo('OVERVIEW');
      }, undefined, (error) => {
        console.error('Error loading image:', error);
      });
    }

    // Initialize active thumbnail
    updateActiveThumbnail();

    // ======================
    // DRAG AND DROP
    // ======================
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      dropZone.style.display = 'block';
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.style.display = 'none';
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.style.display = 'none';
      
      if (!screenQuad) {
        console.warn('Screen quad not initialized yet');
        return;
      }

      const files = Array.from(e.dataTransfer.files).filter(file => 
        allowedImageTypes.includes(file.type)
      );

      if (files.length === 0) {
        console.warn('No valid image files dropped');
        return;
      }

      const file = files[0];
      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          if (currentImageTexture) currentImageTexture.dispose();
          
          currentImageTexture = new THREE.Texture(img);
          currentImageTexture.encoding = THREE.sRGBEncoding;
          currentImageTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          currentImageTexture.minFilter = THREE.LinearFilter;
          currentImageTexture.magFilter = THREE.LinearFilter;
          currentImageTexture.needsUpdate = true;

          screenQuad.material.map = currentImageTexture;
          screenQuad.material.toneMapped = false;
          screenQuad.material.needsUpdate = true;
          
          cameraRig.transitionTo('OVERVIEW');
        };
        img.onerror = () => console.error('Failed to load dropped image');
        img.src = event.target.result;
      };

      reader.onerror = () => console.error('Failed to read dropped file');
      reader.readAsDataURL(file);
    }

    document.addEventListener('dragover', handleDragOver);
    document.addEventListener('dragleave', handleDragLeave);
    document.addEventListener('drop', handleDrop);

    // ======================
    // CONTROLS
    // ======================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI * 0.9;
    controls.minDistance = 1;
    controls.maxDistance = 15;

    const cameraRig = new CameraRig(camera, controls);
    cameraRig.transitionTo('INTRO');

    // ======================
    // LEFT NAVIGATION BUTTONS
    // ======================
    document.getElementById('nav-intro').addEventListener('click', (e) => {
      e.preventDefault();
      cameraRig.transitionTo('INTRO');
    });

    document.getElementById('nav-overview').addEventListener('click', (e) => {
      e.preventDefault();
      cameraRig.transitionTo('OVERVIEW');
    });

    document.getElementById('nav-detail').addEventListener('click', (e) => {
      e.preventDefault();
      cameraRig.transitionTo('DETAIL_VIEW');
    });

    document.getElementById('nav-orbit').addEventListener('click', (e) => {
      e.preventDefault();
      cameraRig.startOrbiting();
    });

    // ======================
    // EVENT HANDLERS
    // ======================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case '1': cameraRig.transitionTo('INTRO'); break;
        case '2': cameraRig.transitionTo('OVERVIEW'); break;
        case '3': cameraRig.transitionTo('DETAIL_VIEW'); break;
        case 'o': cameraRig.startOrbiting(); break;
        case 'r': // Reset screen texture
          if (screenQuad.material) {
            if (currentImageTexture) currentImageTexture.dispose();
            screenQuad.material.map = null;
            screenQuad.material.color.set(0x000000);
            screenQuad.material.needsUpdate = true;
          }
          break;
        case 'd': // Toggle debug helpers
          if (debugHelpers.length > 0) {
            debugHelpers.forEach(helper => scene.remove(helper));
            debugHelpers = [];
          } else {
            setupScreenDebug();
          }
          break;
        case 'l': // Toggle rectangle area light
          screenFillLight.intensity = screenFillLight.intensity > 0 ? 0 : 3;
          console.log('Rectangle area light intensity:', screenFillLight.intensity);
          break;
      }
    });

    // ======================
    // DEBUG HELPERS
    // ======================
    function setupScreenDebug() {
      if (!screenQuad) return;
      
      debugHelpers.forEach(helper => scene.remove(helper));
      debugHelpers = [];
      
      const wireframe = new THREE.LineSegments(
        new THREE.EdgesGeometry(screenQuad.geometry),
        new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 })
      );
      wireframe.position.copy(screenQuad.position);
      scene.add(wireframe);
      debugHelpers.push(wireframe);
      
      SCREEN_ANCHORS.forEach((point, i) => {
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.01, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        sphere.position.copy(point);
        scene.add(sphere);
        debugHelpers.push(sphere);
      });
    }

    // ======================
    // ANIMATION LOOP
    // ======================
    function animate() {
      requestAnimationFrame(animate);
      cameraRig.update();
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
