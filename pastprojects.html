<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Project Viewer with Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      background: #61503c;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    /* Left Navigation Styles */
    nav {
      width: 33.33%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      background: transparent;
      z-index: 2;
    }

    .nav-buttons {
      list-style: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 0;
      margin: 0;
    }

    .nav-buttons li {
      height: 20vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-buttons li a {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px) brightness(1.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .nav-buttons li a:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* Thumbnail Gallery Styles */
    #thumbnails {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 100;
      gap: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }

    #thumbnails::-webkit-scrollbar {
      width: 6px;
    }

    #thumbnails::-webkit-scrollbar-track {
      background: transparent;
    }

    #thumbnails::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.3);
      border-radius: 3px;
    }

    .thumbnail {
      width: 80px;
      height: 80px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .thumbnail:hover {
      border-color: #0066cc;
      transform: scale(1.1);
    }

    .video-thumbnail {
      position: relative;
    }

    .video-thumbnail::after {
      content: '▶';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: white;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }

    #gallery-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .nav-btn {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      text-align: center;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.4);
    }

    /* Three.js Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Drop Zone */
    .drop-zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 1000;
      pointer-events: none;
      border: 4px dashed white;
    }

    .drop-zone div {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2em;
      text-align: center;
    }

    /* Video Controls */
    #video-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 5px;
      z-index: 101;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #video-controls.visible {
      opacity: 1;
      pointer-events: all;
    }

    .video-btn {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .video-btn:hover {
      background: rgba(255,255,255,0.4);
    }

    .video-btn.active {
      background: rgba(0,102,204,0.7);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      nav {
        width: 100%;
        height: auto;
      }

      .nav-buttons {
        flex-direction: row;
        flex-wrap: wrap;
        height: auto;
        padding: 10px;
      }

      .nav-buttons li {
        height: 60px;
        padding: 5px;
        flex: 1 0 45%;
      }

      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0; 
      }

      #thumbnails {
        top: auto;
        bottom: 10px;
        right: 10px;
        transform: none;
        flex-direction: row;
        max-height: 100px;
        max-width: 90%;
        overflow-x: auto;
        overflow-y: hidden;
      }

      #gallery-controls {
        flex-direction: row;
      }

      .thumbnail {
        width: 60px;
        height: 60px;
      }

      #video-controls {
        bottom: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- Three.js will render here -->
  <div id="canvas-container"></div>

  <!-- Thumbnail Gallery with videos -->
  <div id="thumbnails">
    <div id="gallery-controls">

      <img src="assets/images/Slide2.PNG" class="thumbnail" draggable="true" data-type="image">

      <img src="assets/images/Slide4.PNG" class="thumbnail" draggable="true" data-type="image">
      <img src="assets/images/Slide5.PNG" class="thumbnail" draggable="true" data-type="image">

      <img src="assets/images/Slide7.PNG" class="thumbnail" draggable="true" data-type="image">
      <img src="assets/images/Slide8.PNG" class="thumbnail" draggable="true" data-type="image">

  <!-- Video Controls -->
  <div id="video-controls">

  <!-- Drop Zone -->
  <div class="drop-zone">
    <div>Drop PNG/JPEG Image or MP4 Video Here<br><span style="font-size: 0.6em;">(PNG, JPG, or MP4 files only)</span></div>

  <!-- CDN Imports -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.11.4/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/lights/RectAreaLightUniformsLib.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/helpers/RectAreaLightHelper.js"></script>

  <!-- Main Application Script -->
  <script>
    // Initialize area light support
    THREE.RectAreaLightUniformsLib.init();

    // ======================
    // ASSET PATHS
    // ======================
    const ASSETS = {
      MODEL: 'assets/models/DeskOverview1.glb',
      BACKGROUND: 'assets/images/BackgroundRotating.png',
      DEFAULT_SCREEN_TEXTURE: 'assets/images/default-screen.png'
    };

    // ======================
    // SCREEN ANCHOR POINTS
    // ======================
    const SCREEN_Y_OFFSET = -0.995;
    const SCREEN_ANCHORS = [
      new THREE.Vector3(0.5218123197555542, 0.8660084009170532 + SCREEN_Y_OFFSET, -0.6475707292556763),  // top-right
      new THREE.Vector3(0.5218123197555542, 0.733871579170227 + SCREEN_Y_OFFSET, -0.0846579372882843),   // bottom-right
      new THREE.Vector3(-0.27778705954551697, 0.8660078048706055 + SCREEN_Y_OFFSET, -0.6475707292556763), // top-left
      new THREE.Vector3(-0.2777869999408722, 0.7338709831237793 + SCREEN_Y_OFFSET, -0.0846579372882843)  // bottom-left
    ];

    // Calculate screen center point
    const screenCenter = new THREE.Vector3();
    SCREEN_ANCHORS.forEach(point => screenCenter.add(point));
    screenCenter.divideScalar(SCREEN_ANCHORS.length);

    // ======================
    // GLOBAL VARIABLES
    // ======================
    let screenMesh = null;
    let screenMaterial = null;
    const allowedImageTypes = ['image/png', 'image/jpeg', 'image/jpg'];
    const allowedVideoTypes = ['video/mp4', 'video/webm', 'video/ogg'];
    let debugHelpers = [];
    let screenFillLight;
    let currentImageTexture = null;
    let currentVideoTexture = null;
    let screenPlane = null;
    let screenQuad = null;
    let videoElement = null;
    let isVideoPlaying = false;
    let videoSettings = {
      muted: false,
      autoplay: true,
      loop: true
    };

    // ======================
    // SCREEN NORMAL CALCULATION
    // ======================
    function calculateScreenNormal() {
      // Get three points from the screen quad to form two vectors
      const p0 = new THREE.Vector3(SCREEN_ANCHORS[2].x, SCREEN_ANCHORS[2].y, SCREEN_ANCHORS[2].z);
      const p1 = new THREE.Vector3(SCREEN_ANCHORS[0].x, SCREEN_ANCHORS[0].y, SCREEN_ANCHORS[0].z);
      const p2 = new THREE.Vector3(SCREEN_ANCHORS[3].x, SCREEN_ANCHORS[3].y, SCREEN_ANCHORS[3].z);

      // Create two vectors in the plane of the screen
      const v1 = new THREE.Vector3().subVectors(p1, p0);
      const v2 = new THREE.Vector3().subVectors(p2, p0);

      // Calculate the normal vector (cross product)
      const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();

      return normal;
    }

    // ======================
    // CAMERA PRESETS
    // ======================
    const CAMERA_PRESETS = {
      INTRO: {
        position: new THREE.Vector3(0, 2.05, 3.9),
        target: new THREE.Vector3(0, -0.2, 0),
        fov: 35
      },
      OVERVIEW: {
        position: new THREE.Vector3(0, 0.43, -0.195),
        target: new THREE.Vector3(0, -2.5, -1.0),
        fov: 50
      },
      DETAIL_VIEW: {
        position: new THREE.Vector3(0, 0.2, 4.5),
        target: new THREE.Vector3(0, -1.2, -13),
        fov: 35
      },
      ORBIT: {
        radius: 5,
        height: -0.3,
        speed: 0.002
      },
      SCREEN_NORMAL: {
        distance: 1.5, // Distance from screen center
        fov: 45
      },
      SCREEN_OPPOSITE: {
        distance: 1.5, // Distance from screen center
        fov: 45
      }
    };

    // ======================
    // CAMERA RIG SYSTEM
    // ======================
    class CameraRig {
      constructor(camera, controls) {
        this.camera = camera;
        this.controls = controls;
        this.isOrbiting = false;
        this.orbitAngle = 0;
      }

      transitionTo(presetName, duration = 2) {
        const preset = CAMERA_PRESETS[presetName];
        if (!preset) {
          console.warn(`Camera preset "${presetName}" not found.`);
          return;
        }

        this.isOrbiting = false;
        this.controls.autoRotate = false;

        gsap.timeline()
          .to(this.camera.position, {
            x: preset.position.x,
            y: preset.position.y,
            z: preset.position.z,
            duration,
            ease: 'sine.inOut'
          })
          .to(this.controls.target, {
            x: preset.target.x,
            y: preset.target.y,
            z: preset.target.z,
            duration: duration * 0.9
          }, '<0.2')
          .to(this.camera, {
            fov: preset.fov || 50,
            duration: duration * 0.7,
            onUpdate: () => this.camera.updateProjectionMatrix()
          }, '<');
      }

      transitionToScreenNormal(duration = 2) {
        const preset = CAMERA_PRESETS.SCREEN_NORMAL;
        const normal = calculateScreenNormal();
        
        // Calculate screen center point
        const screenCenter = new THREE.Vector3();
        SCREEN_ANCHORS.forEach(point => {
          screenCenter.add(new THREE.Vector3(point.x, point.y, point.z));
        });
        screenCenter.divideScalar(SCREEN_ANCHORS.length);

        // Position camera along normal vector at specified distance
        const cameraPosition = new THREE.Vector3().copy(normal)
          .multiplyScalar(preset.distance)
          .add(screenCenter);

        this.isOrbiting = false;
        this.controls.autoRotate = false;

        gsap.timeline()
          .to(this.camera.position, {
            x: cameraPosition.x,
            y: cameraPosition.y,
            z: cameraPosition.z,
            duration,
            ease: 'sine.inOut'
          })
          .to(this.controls.target, {
            x: screenCenter.x,
            y: screenCenter.y,
            z: screenCenter.z,
            duration: duration * 0.9
          }, '<0.2')
          .to(this.camera, {
            fov: preset.fov || 45,
            duration: duration * 0.7,
            onUpdate: () => this.camera.updateProjectionMatrix()
          }, '<');
      }

      transitionToScreenOpposite(duration = 2) {
        const preset = CAMERA_PRESETS.SCREEN_OPPOSITE;
        const normal = calculateScreenNormal();
        
        // Calculate screen center point
        const screenCenter = new THREE.Vector3();
        SCREEN_ANCHORS.forEach(point => {
          screenCenter.add(new THREE.Vector3(point.x, point.y, point.z));
        });
        screenCenter.divideScalar(SCREEN_ANCHORS.length);

        // Position camera along the opposite normal vector at specified distance
        const cameraPosition = new THREE.Vector3().copy(normal)
          .multiplyScalar(-preset.distance) // Negative distance for opposite side
          .add(screenCenter);

        this.isOrbiting = false;
        this.controls.autoRotate = false;

        gsap.timeline()
          .to(this.camera.position, {
            x: cameraPosition.x,
            y: cameraPosition.y,
            z: cameraPosition.z,
            duration,
            ease: 'sine.inOut'
          })
          .to(this.controls.target, {
            x: screenCenter.x,
            y: screenCenter.y,
            z: screenCenter.z,
            duration: duration * 0.9
          }, '<0.2')
          .to(this.camera, {
            fov: preset.fov || 45,
            duration: duration * 0.7,
            onUpdate: () => this.camera.updateProjectionMatrix()
          }, '<');
      }

      startOrbiting() {
        this.isOrbiting = true;
        this.orbitAngle = 0;
        const preset = CAMERA_PRESETS.ORBIT;
        this.controls.autoRotate = true;
        this.controls.autoRotateSpeed = preset.speed;
        this.controls.target.set(0, preset.height, 0);
      }

      update() {
        if (this.isOrbiting) {
          const preset = CAMERA_PRESETS.ORBIT;
          this.orbitAngle += preset.speed;
          this.camera.position.x = Math.sin(this.orbitAngle) * preset.radius;
          this.camera.position.z = Math.cos(this.orbitAngle) * preset.radius;
          this.camera.position.y = preset.height;
          this.controls.update();
        }
      }
    }

    // ======================
    // SCENE SETUP
    // ======================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.domElement.id = 'threejs-canvas';
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.physicallyCorrectLights = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;

    // ======================
    // SCREEN QUAD SETUP
    // ======================
    function createScreenQuad() {
      const geometry = new THREE.BufferGeometry();

      const vertices = new Float32Array([
        SCREEN_ANCHORS[2].x, SCREEN_ANCHORS[2].y, SCREEN_ANCHORS[2].z,
        SCREEN_ANCHORS[0].x, SCREEN_ANCHORS[0].y, SCREEN_ANCHORS[0].z,
        SCREEN_ANCHORS[3].x, SCREEN_ANCHORS[3].y, SCREEN_ANCHORS[3].z,
        SCREEN_ANCHORS[1].x, SCREEN_ANCHORS[1].y, SCREEN_ANCHORS[1].z
      ]);

      const uvs = new Float32Array([
        0, 1,
        1, 1,
        0, 0,
        1, 0
      ]);

      const indices = new Uint16Array([0, 1, 2, 1, 3, 2]);

      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.setIndex(new THREE.BufferAttribute(indices, 1));

      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 1.0,
        toneMapped: false,
        premultipliedAlpha: false
      });

      screenQuad = new THREE.Mesh(geometry, material);
      screenQuad.renderOrder = 999;
      scene.add(screenQuad);
    }

    // ======================
    // VIDEO TEXTURE SETUP
    // ======================
    function createVideoElement() {
      if (videoElement) {
        videoElement.pause();
        document.body.removeChild(videoElement);
      }
      
      videoElement = document.createElement('video');
      videoElement.style.display = 'none';
      videoElement.crossOrigin = 'anonymous';
      videoElement.playsInline = true;
      document.body.appendChild(videoElement);
      
      // Apply video settings
      videoElement.muted = videoSettings.muted;
      videoElement.loop = videoSettings.loop;
      videoElement.autoplay = videoSettings.autoplay;
      
      return videoElement;
    }

    function createVideoTexture(video) {
      const texture = new THREE.VideoTexture(video);
      texture.encoding = THREE.sRGBEncoding;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      
      return texture;
    }

    // ======================
    // LIGHTING
    // ======================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(5, 10, 7);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    screenFillLight = new THREE.RectAreaLight(0xffffff, 3, 3, 3); // Always on with intensity 3
    screenFillLight.position.set(0, 5, 0.2);
    screenFillLight.rotation.x = -Math.PI / 2;
    scene.add(screenFillLight);

    const lightHelper = new THREE.RectAreaLightHelper(screenFillLight);
    scene.add(lightHelper);

    // ======================
    // BACKGROUND
    // ======================
    const bgTexture = new THREE.TextureLoader().load(ASSETS.BACKGROUND);
    bgTexture.encoding = THREE.sRGBEncoding;
    scene.background = bgTexture;

    // ======================
    // MODEL LOADING & SCREEN SETUP
    // ======================
    const loader = new THREE.GLTFLoader();
    let deskModel;

    loader.load(ASSETS.MODEL, (gltf) => {
      deskModel = gltf.scene;
      console.log('Model loaded:', gltf);

      gltf.scene.traverse((child) => {
        if (child.isLight) {
          child.intensity *= 1.5;
          child.castShadow = true;
          console.log(`Light found: ${child.name}`, child);
        }
      });

      gltf.scene.traverse((child) => {
        if (child.isMesh && child.name === 'PNGApplicationScreen') {
          screenMesh = child;

          screenMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.01,
            side: THREE.DoubleSide,
            toneMapped: false
          });

          screenMesh.material = screenMaterial;
          screenMesh.renderOrder = 998;
        }

        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;

          if (child.material.emissiveMap) {
            child.material.emissiveIntensity = 1.0;
            child.material.emissiveMap.encoding = THREE.sRGBEncoding;
          }
        }
      });

      deskModel.position.set(0, -1, 0);
      scene.add(deskModel);
      createScreenQuad();

      // Load default screen texture
      if (ASSETS.DEFAULT_SCREEN_TEXTURE) {
        currentImageTexture = new THREE.TextureLoader().load(ASSETS.DEFAULT_SCREEN_TEXTURE, (tex) => {
          tex.encoding = THREE.sRGBEncoding;
          tex.flipY = false;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          screenQuad.material.map = tex;
          screenQuad.material.toneMapped = false;
          screenQuad.material.needsUpdate = true;
        });
      }
    }, undefined, (error) => {
      console.error('Error loading model:', error);
    });

    // ======================
    // THUMBNAIL GALLERY INTERACTION
    // ======================
    const thumbnails = document.querySelectorAll('.thumbnail');
    const dropZone = document.querySelector('.drop-zone');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const videoControls = document.getElementById('video-controls');
    const muteBtn = document.getElementById('mute-btn');
    const autoplayBtn = document.getElementById('autoplay-btn');
    const loopBtn = document.getElementById('loop-btn');
    let currentThumbnailIndex = 0;

    // Handle thumbnail clicks
    thumbnails.forEach((thumb, index) => {
      thumb.addEventListener('click', () => {
        currentThumbnailIndex = index;
        const mediaType = thumb.getAttribute('data-type');
        
        if (mediaType === 'video') {
          const videoSrc = thumb.getAttribute('data-src');
          loadVideoToScreen(videoSrc);
        } else {
          loadImageToScreen(thumb.src);
        }
        
        updateActiveThumbnail();
      });
    });

    // Navigation buttons
    prevBtn.addEventListener('click', () => {
      if (currentThumbnailIndex > 0) {
        currentThumbnailIndex--;
      } else {
        currentThumbnailIndex = thumbnails.length - 1;
      }
      
      const thumb = thumbnails[currentThumbnailIndex];
      const mediaType = thumb.getAttribute('data-type');
      
      if (mediaType === 'video') {
        const videoSrc = thumb.getAttribute('data-src');
        loadVideoToScreen(videoSrc);
      } else {
        loadImageToScreen(thumb.src);
      }
      
      updateActiveThumbnail();
    });

    nextBtn.addEventListener('click', () => {
      if (currentThumbnailIndex < thumbnails.length - 1) {
        currentThumbnailIndex++;
      } else {
        currentThumbnailIndex = 0;
      }
      
      const thumb = thumbnails[currentThumbnailIndex];
      const mediaType = thumb.getAttribute('data-type');
      
      if (mediaType === 'video') {
        const videoSrc = thumb.getAttribute('data-src');
        loadVideoToScreen(videoSrc);
      } else {
        loadImageToScreen(thumb.src);
      }
      
      updateActiveThumbnail();
    });

    // Video control buttons
    muteBtn.addEventListener('click', () => {
      videoSettings.muted = !videoSettings.muted;
      if (videoElement) {
        videoElement.muted = videoSettings.muted;
      }
      muteBtn.classList.toggle('active', videoSettings.muted);
      muteBtn.textContent = videoSettings.muted ? 'Unmute' : 'Mute';
    });

    autoplayBtn.addEventListener('click', () => {
      videoSettings.autoplay = !videoSettings.autoplay;
      if (videoElement) {
        videoElement.autoplay = videoSettings.autoplay;
        if (videoSettings.autoplay && !isVideoPlaying) {
          videoElement.play().catch(e => console.error('Video play failed:', e));
        }
      }
      autoplayBtn.classList.toggle('active', videoSettings.autoplay);
    });

    loopBtn.addEventListener('click', () => {
      videoSettings.loop = !videoSettings.loop;
      if (videoElement) {
        videoElement.loop = videoSettings.loop;
      }
      loopBtn.classList.toggle('active', videoSettings.loop);
    });

    function updateActiveThumbnail() {
      thumbnails.forEach((thumb, index) => {
        if (index === currentThumbnailIndex) {
          thumb.style.borderColor = '#0066cc';
          thumb.style.transform = 'scale(1.1)';
          // Scroll into view
          thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          thumb.style.borderColor = 'transparent';
          thumb.style.transform = 'scale(1)';
        }
      });
    }

    function loadImageToScreen(imageUrl) {
      if (!screenQuad) {
        console.warn('Screen quad not ready yet');
        return;
      }

      // Stop any playing video
      if (videoElement) {
        videoElement.pause();
        isVideoPlaying = false;
      }
      
      // Hide video controls
      videoControls.classList.remove('visible');

      const loader = new THREE.TextureLoader();
      loader.load(imageUrl, (texture) => {
        if (currentImageTexture) currentImageTexture.dispose();
        if (currentVideoTexture) {
          currentVideoTexture.dispose();
          currentVideoTexture = null;
        }

        currentImageTexture = texture;
        currentImageTexture.encoding = THREE.sRGBEncoding;
        currentImageTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        currentImageTexture.minFilter = THREE.LinearFilter;
        currentImageTexture.magFilter = THREE.LinearFilter;

        screenQuad.material.map = currentImageTexture;
        screenQuad.material.needsUpdate = true;

        cameraRig.transitionTo('OVERVIEW');
      }, undefined, (error) => {
        console.error('Error loading image:', error);
      });
    }

    function loadVideoToScreen(videoUrl) {
      if (!screenQuad) {
        console.warn('Screen quad not ready yet');
        return;
      }

      // Show video controls
      videoControls.classList.add('visible');

      // Create video element
      const video = createVideoElement();
      video.src = videoUrl;
      
      video.addEventListener('loadeddata', () => {
        if (currentImageTexture) currentImageTexture.dispose();
        if (currentVideoTexture) currentVideoTexture.dispose();

        currentVideoTexture = createVideoTexture(video);
        
        screenQuad.material.map = currentVideoTexture;
        screenQuad.material.needsUpdate = true;

        // Play video if autoplay is enabled
        if (videoSettings.autoplay) {
          video.play().then(() => {
            isVideoPlaying = true;
          }).catch(e => {
            console.error('Video autoplay failed:', e);
            isVideoPlaying = false;
          });
        }

        cameraRig.transitionTo('OVERVIEW');
      });

      video.addEventListener('error', (e) => {
        console.error('Error loading video:', e);
        // Fall back to default image
        if (ASSETS.DEFAULT_SCREEN_TEXTURE) {
          loadImageToScreen(ASSETS.DEFAULT_SCREEN_TEXTURE);
        }
      });
    }

    // Initialize active thumbnail
    updateActiveThumbnail();

    // ======================
    // DRAG AND DROP
    // ======================
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      dropZone.style.display = 'block';
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.style.display = 'none';
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.style.display = 'none';

      if (!screenQuad) {
        console.warn('Screen quad not initialized yet');
        return;
      }

      const files = Array.from(e.dataTransfer.files);
      const imageFiles = files.filter(file => allowedImageTypes.includes(file.type));
      const videoFiles = files.filter(file => allowedVideoTypes.includes(file.type));

      if (imageFiles.length === 0 && videoFiles.length === 0) {
        console.warn('No valid image or video files dropped');
        return;
      }

      const file = imageFiles.length > 0 ? imageFiles[0] : videoFiles[0];
      const reader = new FileReader();

      reader.onload = (event) => {
        if (allowedImageTypes.includes(file.type)) {
          // Handle image file
          const img = new Image();
          img.onload = () => {
            if (currentImageTexture) currentImageTexture.dispose();
            if (currentVideoTexture) {
              currentVideoTexture.dispose();
              currentVideoTexture = null;
            }
            
            // Hide video controls for images
            videoControls.classList.remove('visible');

            currentImageTexture = new THREE.Texture(img);
            currentImageTexture.encoding = THREE.sRGBEncoding;
            currentImageTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            currentImageTexture.minFilter = THREE.LinearFilter;
            currentImageTexture.magFilter = THREE.LinearFilter;
            currentImageTexture.needsUpdate = true;

            screenQuad.material.map = currentImageTexture;
            screenQuad.material.toneMapped = false;
            screenQuad.material.needsUpdate = true;

            cameraRig.transitionTo('OVERVIEW');
          };
          img.onerror = () => console.error('Failed to load dropped image');
          img.src = event.target.result;
        } else if (allowedVideoTypes.includes(file.type)) {
          // Handle video file
          const videoUrl = URL.createObjectURL(file);
          loadVideoToScreen(videoUrl);
        }
      };

      reader.onerror = () => console.error('Failed to read dropped file');
      reader.readAsDataURL(file);
    }

    document.addEventListener('dragover', handleDragOver);
    document.addEventListener('dragleave', handleDragLeave);
    document.addEventListener('drop', handleDrop);

    // ======================
    // CONTROLS
    // ======================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI * 0.9;
    controls.minDistance = 1;
    controls.maxDistance = 15;

    const cameraRig = new CameraRig(camera, controls);
    cameraRig.transitionTo('INTRO');

    // ======================
    // LEFT NAVIGATION BUTTONS
    // ======================
    document.getElementById('nav-intro').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'index.html';
    });

    document.getElementById('nav-overview').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'recentnews.html';
    });

    document.getElementById('nav-detail').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'photography.html';
    });

    document.getElementById('nav-orbit').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'pastprojects.html';
    });

    document.getElementById('nav-orbit2').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'morefromme.html';
    });

    // ======================
    // EVENT HANDLERS
    // ======================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case '1': cameraRig.transitionTo('INTRO'); break;
        case '2': cameraRig.transitionTo('OVERVIEW'); break;
        case '3': cameraRig.transitionTo('DETAIL_VIEW'); break;
        case '4': cameraRig.transitionToScreenNormal(); break;
        case '5': cameraRig.transitionToScreenOpposite(); break;
        case 'o': cameraRig.startOrbiting(); break;
        case 'r': // Reset screen texture
          if (screenQuad.material) {
            if (currentImageTexture) currentImageTexture.dispose();
            if (currentVideoTexture) currentVideoTexture.dispose();
            screenQuad.material.map = null;
            screenQuad.material.color.set(0x000000);
            screenQuad.material.needsUpdate = true;
            
            // Hide video controls
            videoControls.classList.remove('visible');
            
            // Stop any playing video
            if (videoElement) {
              videoElement.pause();
              isVideoPlaying = false;
            }
          }
          break;
        case 'd': // Toggle debug helpers
          if (debugHelpers.length > 0) {
            debugHelpers.forEach(helper => scene.remove(helper));
            debugHelpers = [];
          } else {
            setupScreenDebug();
          }
          break;
        case 'm': // Toggle mute
          if (videoElement) {
            videoSettings.muted = !videoSettings.muted;
            videoElement.muted = videoSettings.muted;
            muteBtn.classList.toggle('active', videoSettings.muted);
            muteBtn.textContent = videoSettings.muted ? 'Unmute' : 'Mute';
          }
          break;
      }
    });

    // ======================
    // DEBUG HELPERS
    // ======================
    function setupScreenDebug() {
      if (!screenQuad) return;

      debugHelpers.forEach(helper => scene.remove(helper));
      debugHelpers = [];

      const wireframe = new THREE.LineSegments(
        new THREE.EdgesGeometry(screenQuad.geometry),
        new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 2 })
      );
      wireframe.position.copy(screenQuad.position);
      scene.add(wireframe);
      debugHelpers.push(wireframe);

      SCREEN_ANCHORS.forEach((point, i) => {
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(0.01, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        sphere.position.copy(point);
        scene.add(sphere);
        debugHelpers.push(sphere);
      });
    }

    // ======================
    // ANIMATION LOOP
    // ======================
    function animate() {
      requestAnimationFrame(animate);
      cameraRig.update();
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
