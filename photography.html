<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Image Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      overflow-x: hidden;
      background: #61503c;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    nav {
      width: 33.33%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      background: transparent;
      z-index: 2;
    }

    .nav-buttons {
      list-style: none;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 0;
      margin: 0;
    }

    .nav-buttons li {
      height: 20vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-buttons li a {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px) brightness(1.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .nav-buttons li a:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .gallery {
      width: 66.66%;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: calc(25vh - 15px);
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
      background: #fff;
      position: relative;
      cursor: pointer;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background: transparent;
      user-select: none;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .image-title {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 8px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-align: center;
      pointer-events: none;
      user-select: none;
    }

    /* Modal / Enlarged container */
    .enlarged-container {
      position: fixed;
      top: 0;
      left: 33.33%;
      width: 66.66%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.75);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      padding: 1rem;
      box-sizing: border-box;
      user-select: none;
      touch-action: none;
      overflow: hidden;
    }

    .enlarged-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .enlarged-image {
      max-width: 90%;
      max-height: 80%;
      object-fit: contain;
      border-radius: 8px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: transform 0.3s ease;
      transform-origin: center center;
      will-change: transform;
      position: relative;
      left: 0;
      top: 0;
    }

    .enlarged-title {
      margin-top: 1rem;
      color: white;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: clamp(1rem, 2vw, 1.5rem);
      text-align: center;
      max-width: 90%;
      text-shadow: 0 0 5px rgba(0,0,0,0.7);
      user-select: none;
    }

    /* Navigation buttons inside modal */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.7);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s ease;
      z-index: 20;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.9);
    }

    .nav-btn:active {
      background: rgba(255,255,255,1);
    }

    #prevBtn {
      left: 5%;
    }

    #nextBtn {
      right: 5%;
    }

    #closeBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255,255,255,0.7);
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s ease;
      z-index: 20;
    }

    #closeBtn:hover {
      background: rgba(255,255,255,0.9);
    }

    #closeBtn:active {
      background: rgba(255,255,255,1);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      nav, .gallery {
        width: 100%;
        height: auto;
      }
      .nav-buttons {
        flex-direction: row;
        flex-wrap: wrap;
        height: auto;
        padding: 10px;
      }
      .nav-buttons li {
        height: 60px;
        padding: 5px;
        flex: 1 0 45%;
      }
      .gallery {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: calc(50vw - 15px);
        height: auto;
        min-height: calc(100vh - 120px);
      }
      .enlarged-container {
        left: 0;
        width: 100%;
        height: 100vh;
        padding-bottom: 2rem;
      }
      .enlarged-image {
        max-height: 70vh;
      }
      #prevBtn, #nextBtn {
        width: 50px;
        height: 50px;
        font-size: 28px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: calc(33.33vh - 15px);
      }
    }
  </style>
</head>
<body>

  <nav>
    <ul class="nav-buttons">
      <li><a href="index.html">Home</a></li>
      <li><a href="recentnews.html">Recent News</a></li>
      <li><a href="photography.html">Photography</a></li>
      <li><a href="pastprojects.html">Past Projects</a></li>
      <li><a href="morefromme.html">More From Me</a></li>
    </ul>
  </nav>

  <div class="gallery"></div>

  <div class="enlarged-container" aria-modal="true" role="dialog" aria-hidden="true">
    <button id="closeBtn" aria-label="Close">&times;</button>
    <button class="nav-btn" id="prevBtn" aria-label="Previous Image">&#10094;</button>
    <img class="enlarged-image" src="" alt="" />
    <button class="nav-btn" id="nextBtn" aria-label="Next Image">&#10095;</button>
    <div class="enlarged-title"></div>
  </div>

<script>
  const galleryData = [
    { title: "Time, and Again", src: "CM1_1305_1.PNG" },
    { title: "Greatness is my Purpose", src: "CM1_3452.png" },
    { title: "Shared View", src: "CM1_1755.png" },
    { title: "Homerton Great Hall", src: "CM1_3181.jpeg" },
    { title: "Homerton Great Hall", src: "CM1_3199.jpeg" },
    { title: "Onwards", src: "CM1_1768.png" },
    { title: "Promotional Material", src: "JAPAN_0184.JPG" },
    { title: "Embrace", src: "IMG_0322.JPG" },
    { title: "Urban Idol", src: "JAPAN_0045.JPG" },
    { title: "Ingress", src: "CM1_2078.png" },
    { title: "Focal Point", src: "CM1_2092-2.png" },
    { title: "Social Alignment", src: "20230909-IMG_0283.jpg" },
    { title: "Throwntogetherness", src: "CM1_1743.png" },
    { title: "Coaxial", src: "20230909-IMG_0329Adjudicated.png" },
    { title: "Follow the Leader", src: "CM1_2312.png" },
    { title: "Temporal Insignificance", src: "SAM_1118.png" },
    { title: "255 km/h", src: "20230912-NIHON_0073.png" },
    { title: "Speed Limit", src: "CM1_2088.png" },
    { title: "Renewal", src: "20230912-JAPAN_0212.png" },
    { title: "A-Spire", src: "CM1_2627.png" }
  ];

  const gallery = document.querySelector(".gallery");
  const enlargedContainer = document.querySelector(".enlarged-container");
  const enlargedImage = document.querySelector(".enlarged-image");
  const enlargedTitle = document.querySelector(".enlarged-title");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const closeBtn = document.getElementById("closeBtn");

  let currentIndex = 0;
  let scale = 1;
  let lastScale = 1;
  let posX = 0;
  let posY = 0;
  let lastX = 0;
  let lastY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let pinchStartDist = 0;
  let pinchStartScale = 1;

  // Create gallery items
  galleryData.forEach(({title, src}, i) => {
    const item = document.createElement("div");
    item.className = "gallery-item";

    const img = document.createElement("img");
    img.src = src;
    img.alt = title;

    const titleDiv = document.createElement("div");
    titleDiv.className = "image-title";
    titleDiv.textContent = title;

    item.appendChild(img);
    item.appendChild(titleDiv);
    gallery.appendChild(item);

    item.addEventListener("click", () => {
      openModal(i);
    });
  });

  function openModal(index) {
    currentIndex = index;
    updateModal();
    enlargedContainer.classList.add("active");
    enlargedContainer.setAttribute("aria-hidden", "false");
    resetTransform();
  }

  function closeModal() {
    enlargedContainer.classList.remove("active");
    enlargedContainer.setAttribute("aria-hidden", "true");
    resetTransform();
  }

  function updateModal() {
    const {title, src} = galleryData[currentIndex];
    enlargedImage.src = src;
    enlargedImage.alt = title;
    enlargedTitle.textContent = title;
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % galleryData.length;
    updateModal();
    resetTransform();
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + galleryData.length) % galleryData.length;
    updateModal();
    resetTransform();
  }

  // Reset transform and position
  function resetTransform() {
    scale = 1;
    lastScale = 1;
    posX = 0;
    posY = 0;
    lastX = 0;
    lastY = 0;
    updateTransform();
  }

  function updateTransform() {
    enlargedImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  }

  // Drag functionality
  enlargedImage.addEventListener("mousedown", (e) => {
    e.preventDefault();
    isDragging = true;
    startX = e.clientX - lastX;
    startY = e.clientY - lastY;
    enlargedImage.style.cursor = "grabbing";
  });

  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    e.preventDefault();
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    lastX = posX;
    lastY = posY;
    updateTransform();
  });

  window.addEventListener("mouseup", (e) => {
    if (!isDragging) return;
    e.preventDefault();
    isDragging = false;
    enlargedImage.style.cursor = "grab";
  });

  // Touch drag and pinch zoom support
  enlargedImage.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      // Drag start
      isDragging = true;
      startX = e.touches[0].clientX - lastX;
      startY = e.touches[0].clientY - lastY;
    } else if (e.touches.length === 2) {
      // Pinch start
      isDragging = false;
      pinchStartDist = getDistance(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
    }
  }, {passive: false});

  enlargedImage.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      posX = e.touches[0].clientX - startX;
      posY = e.touches[0].clientY - startY;
      lastX = posX;
      lastY = posY;
      updateTransform();
    } else if (e.touches.length === 2) {
      // Pinch zoom
      const newDist = getDistance(e.touches[0], e.touches[1]);
      const scaleFactor = newDist / pinchStartDist;
      scale = Math.min(Math.max(pinchStartScale * scaleFactor, 1), 5); // limit scale 1x-5x
      updateTransform();
    }
  }, {passive: false});

  enlargedImage.addEventListener("touchend", (e) => {
    if (e.touches.length === 0) {
      isDragging = false;
      lastX = posX;
      lastY = posY;
      lastScale = scale;
    }
  });

  function getDistance(touch1, touch2) {
    const dx = touch2.clientX - touch1.clientX;
    const dy = touch2.clientY - touch1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Buttons
  prevBtn.addEventListener("click", showPrev);
  nextBtn.addEventListener("click", showNext);
  closeBtn.addEventListener("click", closeModal);

  // Close modal on background click (not on image or buttons)
  enlargedContainer.addEventListener("click", (e) => {
    if (e.target === enlargedContainer) {
      closeModal();
    }
  });

  // Keyboard navigation inside modal
  window.addEventListener("keydown", (e) => {
    if (!enlargedContainer.classList.contains("active")) return;
    if (e.key === "ArrowRight") showNext();
    else if (e.key === "ArrowLeft") showPrev();
    else if (e.key === "Escape") closeModal();
  });
</script>

</body>
</html>
