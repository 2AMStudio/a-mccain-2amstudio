<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            overflow-x: hidden;
            background: #61503c;
        }

        /* Navigation Bar */
        nav {
            width: 33.33%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            background: transparent;
            z-index: 2;
        }

        .nav-buttons {
            list-style: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 0;
            margin: 0;
        }

        .nav-buttons li {
            height: 20vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-buttons li a {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: clamp(1rem, 2.5vw, 2.5rem);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px) brightness(1.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .nav-buttons li a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Gallery Section */
        .gallery {
            width: 66.66%;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(0, 1fr);
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            background: #fff;
            position: relative;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            background: transparent;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        /* Enlarged image container */
        .enlarged-container {
            position: fixed;
            top: 0;
            left: 33.33%;
            width: 66.66%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .enlarged-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Dim other thumbnails when one is hovered */
        .gallery.dimmed .gallery-item:not(.active) {
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            nav, .gallery {
                width: 100%;
                height: auto;
            }
            .nav-buttons {
                flex-direction: row;
                flex-wrap: wrap;
                height: auto;
                padding: 10px;
            }
            .nav-buttons li {
                height: 60px;
                padding: 5px;
                flex: 1 0 45%;
            }
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                height: auto;
                min-height: 100vh;
            }
            .enlarged-container {
                left: 0;
                width: 100%;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul class="nav-buttons">
            <li><a href="index.html">Home</a></li>
            <li><a href="recentnews.html">Recent News</a></li>
            <li><a href="photography.html">Photography</a></li>
            <li><a href="pastprojects.html">Past Projects</a></li>
            <li><a href="morefromme.html">More From Me</a></li>
        </ul>
    </nav>

    <!-- Gallery Section -->
    <div class="gallery" id="gallery">
        <!-- Images will be added here by JavaScript -->
    </div>

    <!-- Container for enlarged image -->
    <div class="enlarged-container">
        <img class="enlarged-image" id="enlarged-image" src="" alt="">
    </div>

    <script>
        const images = [
            { url: 'CM1_1305_1.PNG', aspect: '800:1000' },
            { url: 'CM1_3452.png', aspect: '800:1000' },
            { url: 'CM1_1755.png', aspect: '800:1000' },
            { url: 'CM1_3181.jpeg', aspect: '1000:1334' },
            { url: 'CM1_3199.jpeg', aspect: '1000:1334' },
            { url: 'CM1_1768.png', aspect: '1000:1334' },
            { url: 'JAPAN_0184.JPG', aspect: '1000:1334' },
            { url: 'IMG_0322.JPG', aspect: '600:800' },
            { url: 'JAPAN_0045.JPG', aspect: '1000:500' },
            { url: 'CM1_2078.png', aspect: '500:1000' },
            { url: 'CM1_2092-2.png', aspect: '800:800' },
            { url: '20230909-IMG_0283.jpg', aspect: '1200:600' },
            { url: 'CM1_1743.png', aspect: '600:1200' },
            { url: '20230909-IMG_0329Adjudicated.png', aspect: '700:500' },
            { url: 'CM1_2312.png', aspect: '500:700' },
            { url: 'SAM_1118.png', aspect: '1000:800' },
            { url: '20230912-NIHON_0073.png', aspect: '800:1000' },
            { url: 'CM1_2088.png', aspect: '800:1000' },
            { url: '20230912-JAPAN_0212.png', aspect: '800:1000' },
            { url: 'CM1_2627.png', aspect: '800:1000' },
        ];

        const gallery = document.getElementById('gallery');
        const enlargedImage = document.getElementById('enlarged-image');

        // Function to calculate grid row span based on aspect ratio
        function getRowSpan(aspectRatio) {
            if (aspectRatio > 1.5) return 1; // Wide images
            if (aspectRatio < 0.7) return 2; // Tall images
            return 1; // Square or moderately rectangular images
        }

        // Create gallery items
        images.forEach((image, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // Calculate aspect ratio from the aspect string
            const [width, height] = image.aspect.split(':').map(Number);
            const aspectRatio = width / height;
            
            // Apply grid row span for desktop view
            if (window.innerWidth > 768) {
                const rowSpan = getRowSpan(aspectRatio);
                item.style.gridRowEnd = `span ${rowSpan}`;
            }
            
            const img = document.createElement('img');
            img.src = image.url;
            img.alt = `Image ${index + 1}`;
            
            img.onload = function() {
                // Store natural dimensions
                item.dataset.width = img.naturalWidth;
                item.dataset.height = img.naturalHeight;
                item.dataset.aspect = img.naturalWidth / img.naturalHeight;
            };
            
            // Thumbnail hover effect
            item.addEventListener('mouseenter', function() {
                // Set the enlarged image source
                enlargedImage.src = image.url;
                enlargedImage.alt = img.alt;
                
                // Show the enlarged image
                enlargedImage.style.opacity = '1';
                
                // Add dimmed class to gallery
                gallery.classList.add('dimmed');
                
                // Mark this item as active
                item.classList.add('active');
            });
            
            item.addEventListener('mouseleave', function() {
                // Hide the enlarged image
                enlargedImage.style.opacity = '0';
                
                // Remove dimmed class
                gallery.classList.remove('dimmed');
                
                // Remove active class
                item.classList.remove('active');
            });
            
            item.appendChild(img);
            gallery.appendChild(item);
        });

        // Handle window resize to adjust grid layout
        window.addEventListener('resize', function() {
            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                const aspectRatio = parseFloat(item.dataset.aspect) || 1;
                if (window.innerWidth > 768) {
                    const rowSpan = getRowSpan(aspectRatio);
                    item.style.gridRowEnd = `span ${rowSpan}`;
                } else {
                    item.style.gridRowEnd = '';
                }
            });
        });
    </script>
</body>
</html>
